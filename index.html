<script>
(function () {
  'use strict';
  const products=JSON.parse(document.getElementById('catalog').textContent);
  const form=document.getElementById('form');
  const field=document.getElementById('article');
  const result=document.getElementById('result');
  const shelf=document.getElementById('shelf');
  const message=document.getElementById('message');
  let selectionTimer=0;
  function clean(value) { return value.trim().toUpperCase().replace(/\s+/g,''); }
  function clear() {
    result.hidden=true;
    message.hidden=true;
    shelf.textContent='';
  }
  function selectLater() {
    clearTimeout(selectionTimer);
    selectionTimer=setTimeout(function () {
      if(document.activeElement===field) field.select();
    },300);
  }
  function lookup(final) {
    let code=clean(field.value);
    if(!code){clear();return;}
    // Recover leading zeroes if somebody typed a shortened numeric E-number.
    if(final && /^\d{1,6}$/.test(code))code=code.padStart(7,'0');
    if(!final && code.length!==7){clear();return;}
    field.value=code;
    if(Object.prototype.hasOwnProperty.call(products,code)){
      shelf.textContent=products[code];
      result.hidden=false;
      message.hidden=true;
    } else {
      result.hidden=true;
      message.hidden=false;
    }
    selectLater();
  }
  field.addEventListener('input',function(){
    clearTimeout(selectionTimer);
    lookup(false);
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    lookup(true);
    field.focus();
    field.select();
  });
  field.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      field.value='';
      clear();
      field.focus();
    }
  });
  // Refocus after reopening the minimized app window, not while the cashier uses other programs.
  window.addEventListener('load',function(){field.focus();});
})();
</script>
